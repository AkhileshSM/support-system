server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # ── Timeouts ───────────────────────────────────────────────
    # AgentField triage can take up to 30s for long LLM chains
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # ── API proxy → AgentField control plane ──────────────────
    location /api/v1/ {
        proxy_pass         http://agentfield-server:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Health endpoint ────────────────────────────────────────
    location = /api/health {
        proxy_pass http://agentfield-server:8080/health;
        proxy_read_timeout 5s;
    }

    # ── AgentField dashboard (forwarded as /control/) ─────────
    location /control/ {
        proxy_pass         http://agentfield-server:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Static assets — cache 1 year ──────────────────────────
    location ~* \.(js|css|woff2|woff|ttf|png|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # ── React SPA fallback ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
    }
}
